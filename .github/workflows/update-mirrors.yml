name: Update mirrors

on:
  schedule:
    - cron:  '0 0 1 * *' # Monthly

permissions: {}

jobs:

  update_mirrors:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.x'

    - name: Cache python modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Legunto
      env:
        LEGUNTO_VERSION: '1.0.3'
      run: |
        curl -L "https://github.com/femiwiki/legunto/releases/download/v${LEGUNTO_VERSION}/legunto-${LEGUNTO_VERSION}-py3-none-any.whl" \
          -o "$HOME/legunto-${LEGUNTO_VERSION}-py3-none-any.whl"
        pip install "$HOME/legunto-${LEGUNTO_VERSION}-py3-none-any.whl"

    - name: Check & download for module updates
      run: legunto update

    # A pull request opened with GITHUB_TOKEN triggers no workflows, so the
    # required checks would never run on it
    - uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668 # v5.1.1
      id: get_workflow_token
      with:
        application_id: ${{ vars.PAT_APPLICATION_ID }}
        application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}

    - name: Create a pull request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.get_workflow_token.outputs.token }}
        author: GitHub <noreply@github.com>
        commit-message: Update Scribunto module(s)
        title: Update Scribunto module(s)
        branch: bump-scribunto
