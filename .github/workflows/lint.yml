---
name: Lint
on:
  workflow_call:
permissions: {}
jobs:
  taplo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91 # v2

      - run: taplo fmt --check

      - run: taplo lint

  filenames:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Page and module file names match their wiki titles
        run: |
          # Hangul by code point: the runner's locale cannot compile a 가-힣 range
          wrong=$(
            git -c core.quotepath=off ls-files gadgets | grep -vE '/([a-z._-]|%3A|%2F)+$' || true
            # Template subpages such as TemplateStyles sheets keep their Hangul titles
            git -c core.quotepath=off ls-files pages | grep -vP '(*UTF)/(([a-z._-]|%3A|%2F)+|\x{D2C0}%3A([A-Za-z0-9\x{AC00}-\x{D7A3}._-]|%20|%2F)+)$' || true
            git -c core.quotepath=off ls-files lua | grep -vP '(*UTF)/[A-Z\x{AC00}-\x{D7A3}]([A-Za-z0-9\x{AC00}-\x{D7A3}_-]|%3A|%20|%2F)+$' || true
          )
          if [ -n "$wrong" ]; then echo "$wrong"; exit 1; fi

  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - run: uv run --locked --only-group dev ruff check

      - run: uv run --locked --only-group dev ruff format --check
